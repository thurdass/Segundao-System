spring:
  application:
    name: 2a-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/2a_system?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  jackson:
    time-zone: America/Sao_Paulo

server:
  error:
    include-message: never

app:
  timezone: America/Sao_Paulo
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
