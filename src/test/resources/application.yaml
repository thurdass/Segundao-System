spring:
  application:
    name: 2a-system-test
  datasource:
    url: jdbc:h2:mem:system2a;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hmac-jwt-123456
    expiration-hours: 24

logging:
  level:
    root: WARN
    com.thurdass.system2a: WARN
